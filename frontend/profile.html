<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>POPE Online — Mon compte</title><link href="app.css" rel="stylesheet"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@24.6.0/build/css/intlTelInput.css"/><link href="./assets/favicon.png" rel="icon" type="image/png"/></head>
<body class="bg po-v5-harmony"><header class="topbar"><div class="container row between"><a class="brand link" href="dashboard-private.html"><img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/><div><div class="brand-title">POPE Online</div><div class="brand-sub" id="profileBrandSub">Mon compte</div></div></a><div class="row gap wrap"><button class="btn" data-logout>Déconnexion</button></div></div></header>
<main class="auth-wrap"><section class="auth-card" style="max-width:820px;margin:0 auto"><h2>Mes informations</h2><div class="grid2"><div><label class="label">Nom / Prénom</label><input id="fullName" class="input"/><label class="label">Organisation / Société</label><input id="organization" class="input"/><label class="label">Email</label><input id="email" class="input"/><label class="label">Téléphone</label><div class="po-phone-grid"><div><label class="label small">Indicatif</label><select id="phoneCountrySelect" class="input"></select><input type="hidden" id="phoneCountry"/></div><div><label class="label small">Numéro</label><input id="phoneNumber" class="input"/></div></div><input type="hidden" id="phoneFull"/></div><div><label class="label">Mot de passe actuel</label><input id="currentPassword" type="password" class="input" placeholder="Laisser vide si première connexion admin"/><label class="label">Nouveau mot de passe</label><input id="newPassword" type="password" class="input" placeholder="8 caractères minimum"/><div class="fineprint" id="pwdInfo" style="margin-top:10px"></div></div></div><div class="row gap wrap" style="margin-top:16px"><button class="btn" id="saveProfile">Enregistrer les modifications</button><button class="btn ghost" id="changePassword">Changer le mot de passe</button><button class="btn ghost" id="exportData">Exporter mes données</button></div><div class="fineprint" id="msg"></div><div class="panel" style="margin-top:18px;border:1px solid rgba(255,255,255,.12);padding:16px;border-radius:18px"><h3 style="margin-top:0">Supprimer mon compte</h3><p class="fineprint">Cette action supprimera votre compte et mettra fin à votre accès. Une confirmation vous sera demandée avant suppression.</p><button class="btn danger" id="deleteAccount" type="button">Supprimer mon compte</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/intl-tel-input@24.6.0/build/js/intlTelInput.min.js"></script><script src="./auth-guard.js"></script><script type="module">
import { apiFetch, getApiMessage, clearSession } from './api.js';
import { requireLogin, wireLogout, showToast } from './app.js';
import { attachIntlPhone } from './phone.js';

if(!requireLogin('profile.html')) {}
wireLogout();

const el = (id) => document.getElementById(id);
const brandLink = document.querySelector('.brand.link');
const brandSub = document.getElementById('profileBrandSub');

function resolveAccountSpace(payload){
  const apiSpace = payload?.user?.accountSpace || payload?.user?.account_space;
  const storedSpace = localStorage.getItem('pope_account_space');
  return apiSpace === 'private' || storedSpace === 'private' ? 'private' : 'public';
}
const phone = attachIntlPhone({
  selectInputId:'phoneCountrySelect',
  countryInputId:'phoneCountry',
  numberInputId:'phoneNumber',
  fullInputId:'phoneFull'
});

async function init(){
  try{
    const me = await apiFetch('/auth/me');
    const accountSpace = resolveAccountSpace(me);
    if (brandLink) brandLink.setAttribute('href', accountSpace === 'private' ? 'dashboard-private.html' : 'dashboard.html');
    if (brandSub) brandSub.textContent = accountSpace === 'private' ? 'Mon compte privé' : 'Mon compte public';
    el('fullName').value = me.user.full_name || me.user.fullName || '';
    el('organization').value = me.user.organization || '';
    el('email').value = me.user.email || '';
    const phoneFull = me.user.phoneFull || me.user.phone_full || '';
    if (phoneFull && phone?.setFromValue) phone.setFromValue(phoneFull);
    else phone?.sync?.();
    if (me.user.must_change_password || me.user.mustChangePassword) {
      el('pwdInfo').textContent = 'Changement de mot de passe requis.';
    }
  }catch(e){}
}
init();

el('saveProfile').addEventListener('click', async()=>{
  try{
    phone?.sync?.();
    await apiFetch('/auth/me',{
      method:'PUT',
      body:{
        fullName:el('fullName').value.trim(),
        organization:el('organization').value.trim(),
        email:el('email').value.trim(),
        phoneCountry:el('phoneCountry').value,
        phoneNumber:el('phoneNumber').value.trim(),
        phoneFull:el('phoneFull').value
      }
    });
    el('msg').textContent='Modifications enregistrées.';
    showToast('Compte mis à jour','ok');
  }catch(e){
    el('msg').textContent='Erreur : '+getApiMessage(e);
    showToast('Mise à jour impossible','err');
  }
});

el('changePassword').addEventListener('click', async()=>{
  try{
    await apiFetch('/auth/change-password',{
      method:'PUT',
      body:{currentPassword:el('currentPassword').value,newPassword:el('newPassword').value}
    });
    el('pwdInfo').textContent='Mot de passe mis à jour.';
    showToast('Mot de passe modifié','ok');
  }catch(e){
    el('pwdInfo').textContent='Erreur : '+getApiMessage(e);
    showToast('Changement impossible','err');
  }
});


el('exportData').addEventListener('click', async()=>{
  try{
    const data = await apiFetch('/auth/me/export');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'popeonline-mes-donnees.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Export téléchargé','ok');
  }catch(e){
    showToast(getApiMessage(e),'err');
  }
});

el('deleteAccount').addEventListener('click', async()=>{
  const confirmed = window.confirm('Confirmez-vous la suppression définitive de votre compte POPE Online ? Cette action est irréversible.');
  if (!confirmed) return;
  try{
    await apiFetch('/auth/me',{ method:'DELETE' });
    clearSession();
    alert('Votre compte a été supprimé.');
    window.location.href = 'index.html';
  }catch(e){
    showToast(getApiMessage(e),'err');
  }
});
</script></body></html>
