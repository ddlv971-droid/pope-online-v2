<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Connexion client</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/>
</head>
<body class="bg po-v5-harmony">
<header class="topbar"><div class="container row between"><a class="brand link" href="index.html"><img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/><div><div class="brand-title">POPE Online</div><div class="brand-sub">Connexion client</div></div></a><div class="row gap wrap"><a class="btn ghost" href="signup.html">Créer un compte</a></div></div></header>
<main class="auth-wrap"><section class="auth-card" style="max-width:700px;margin:0 auto">
<h2>Connexion</h2><p class="muted">Connexion commune aux espaces public et privé via les identifiants autorisés.</p>
<label class="label">Email ou identifiant</label><input class="input" id="identifier" placeholder="xxxx@..." autocomplete="off">
<label class="label">Mot de passe</label><div class="password-wrap"><input class="input" id="password" placeholder="••••••••" type="password" autocomplete="new-password"><button class="password-toggle visible" id="togglePassword" type="button" aria-label="Afficher le mot de passe">👁</button></div>
<div id="turnstileBox" style="margin-top:14px" hidden></div><div class="row gap wrap" style="margin-top:14px"><button class="btn" id="btn">Se connecter</button><a class="btn ghost" href="forgot-password.html">Mot de passe oublié ?</a></div>
<div class="fineprint" id="msg"></div></section></main>
<script type="module">
import { apiFetch, getApiMessage, setSession } from './api.js';
import { showToast, getFingerprint } from './app.js';
import { mountTurnstile, getTurnstileToken, resetTurnstile } from './turnstile.js';
const el = (id) => document.getElementById(id);
const params = new URLSearchParams(window.location.search || '');
const requestedNext = (params.get('next') || '').trim();
mountTurnstile('turnstileBox').catch(() => {});
function getDefaultNext(user) { if (user?.role === 'admin') return 'dashboard-admin.html'; return user?.accountSpace === 'private' ? 'dashboard-private.html' : 'dashboard.html'; }
function normalizeNext(target, user) {
  if (!target) return getDefaultNext(user);
  const cleaned = target.replace(/^https?:\/\/[^/]+/i, '');
  if (!cleaned || cleaned.startsWith('//')) return getDefaultNext(user);
  if (!/^[\w./?=&%-]+$/.test(cleaned)) return getDefaultNext(user);
  const route = cleaned.startsWith('/') ? cleaned.slice(1) : cleaned;
  const isPrivateUser = user?.accountSpace === 'private';
  const forbiddenPrivate = ['app-private.html','expert-private.html','mission-private.html','dashboard-private.html'];
  const forbiddenPublic = ['app.html','expert.html','mission.html','dashboard.html'];
  if (!isPrivateUser && forbiddenPrivate.some((value) => route.startsWith(value))) return getDefaultNext(user);
  if (isPrivateUser && forbiddenPublic.some((value) => route.startsWith(value))) return getDefaultNext(user);
  return route || getDefaultNext(user);
}
el('togglePassword').addEventListener('click', () => { const i=el('password'); const s=i.type==='text'; i.type=s?'password':'text'; el('togglePassword').textContent=s?'👁':'🙈'; });
el('btn').addEventListener('click', async () => { try { const fp=await getFingerprint(); const identifier=el('identifier').value.trim(); const data=await apiFetch('/auth/login', { method:'POST', body:{ email:identifier, identifier, password:el('password').value, fp, turnstileToken:getTurnstileToken() } }); setSession(data.user || {}); localStorage.setItem('pope_account_space', data?.user?.accountSpace || 'public'); showToast('Connecté ✓','ok'); const nextTarget = normalizeNext(requestedNext, data.user); setTimeout(() => window.location.href=nextTarget, 250); } catch(e) { resetTurnstile(); el('msg').textContent='Erreur : '+getApiMessage(e); showToast('Connexion impossible','err'); } });
</script>
<script>
window.addEventListener("load",function(){
  document.querySelectorAll("input").forEach(i=>{
    if(i.type!=="hidden"){ i.value=""; }
  });
});
</script>

</body></html>
