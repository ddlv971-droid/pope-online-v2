<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Vérification email</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/><link rel="stylesheet" href="popy.css"/>
</head>
<body class="bg">
<header class="topbar">
<div class="container row between">
<a class="brand link" href="index.html">
<div class="logo"></div>
<div>
<div class="brand-title">POPE Online</div>
<div class="brand-sub">Vérification email</div>
</div>
</a>
<div class="row gap">
<a class="btn ghost" href="login.html">Connexion</a>
</div>
</div>
</header>
<main class="auth-wrap">
<section class="auth-card" style="max-width:720px;margin:0 auto">
<h2>Vérification en cours…</h2>
<div class="output" id="out"><div class="muted">Merci de patienter.</div></div>
<div class="row gap wrap" style="margin-top:14px">
<a class="btn" href="login.html">Se connecter</a>
  <a class="btn ghost" href="login.html?next=app.html">Aller à POPE AI</a>
</div>
</section>
</main>
<script type="module">
    import { apiFetch } from './api.js';
    import { showToast, getFingerprint } from './app.js';

    const out = document.getElementById('out');
    const u = new URL(window.location.href);
    const token = u.searchParams.get('token') || '';

    async function run(){
      if (!token) {
        out.textContent = 'Token manquant.';
        return;
      }
      try {
        const fp = await getFingerprint();
        const data = await apiFetch('/auth/verify', { method:'POST', auth:false, body:{ token, fp }});
        const n = data.awardedFreeTickets || 0;
        showToast('Email vérifié ✓', 'ok');
        out.textContent = n > 0
          ? `✅ Email vérifié. ${n} tickets gratuits POPE AI ont été crédités.`
          : `✅ Email vérifié. Aucun ticket gratuit n’a été attribué (anti-abus / vérification).`;
      } catch (e) {
        console.error(e);
        showToast('Vérification impossible', 'err');
        out.textContent = 'Erreur: ' + (e?.data?.error || e.message);
      }
    }

    run();
  </script>

<div id="popyBackdrop" class="popy-backdrop"></div>
<div id="popyWidget" class="popy-widget">
  <button id="popyLauncher" class="popy-launcher popy-launcher-fixed" aria-label="Ouvrir POPY">
    <div class="popy-teaser">Que puis-je faire pour vous faciliter la tâche ?</div>
    <img src="./assets/popy.png" alt="POPY, assistant Pope Online" class="popy-avatar" />
  </button>

  <section id="popyPanel" class="popy-panel" aria-hidden="true">
    <div class="popy-header">
      <div class="popy-header-left">
        <img src="./assets/popy.png" alt="POPY" class="popy-header-avatar" />
        <div>
          <strong>POPY</strong>
          <div class="popy-subtitle">Assistant de navigation POPE Online</div>
        </div>
      </div>
      <button id="popyClose" class="popy-close" aria-label="Fermer">×</button>
    </div>

    <div id="popyMessages" class="popy-messages">
      <div class="popy-msg bot">Bonjour, je suis <strong>POPY</strong>. Je peux vous orienter vers l’univers privé ou public, les offres, la connexion ou la prise de contact.</div>
    </div>

    <div class="popy-suggestions">
      <button class="popy-chip" data-prompt="Je veux aller vers le privé">Privé</button>
      <button class="popy-chip" data-prompt="Je veux aller vers le public">Public</button>
      <button class="popy-chip" data-prompt="Je veux créer un compte">Créer un compte</button>
      <button class="popy-chip" data-prompt="Je veux connaître les offres">Offres</button>
      <button class="popy-chip" data-prompt="Je veux vous contacter">Contact</button>
    </div>

    <form id="popyForm" class="popy-form">
      <input id="popyInput" class="popy-input" type="text" placeholder="Posez votre question à POPY..." autocomplete="off" />
      <button type="submit" class="popy-send">Envoyer</button>
    </form>
  </section>
</div>
<script defer src="popy.js"></script>
</body>
</html>
