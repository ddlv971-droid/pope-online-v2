<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Accompagnement sur mesure</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/>
<link rel="stylesheet" href="popy.css"/>
</head>
<body class="bg po-v5-harmony po-public-v24">
<header class="topbar">
<div class="container row between">
<a class="brand link" href="dashboard.html">
<img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/>
<div>
<div class="brand-title">POPE Online</div>
<div class="brand-sub">Accompagnement sur mesure</div>
</div>
</a>
<div class="row gap wrap">
<span class="badge" data-tickets="">Accès sécurisé</span>
<a class="btn ghost" href="app.html">Génération guidée</a>
<a class="btn ghost" href="pricing.html">Parcours</a>
<button class="btn" data-logout="">Déconnexion</button>
</div>
</div>
</header>

<main class="container app" style="grid-template-columns:1fr">
<section class="card left" style="max-width:980px;margin:0 auto">
<div class="row between">
<h2>Demande d’accompagnement sur mesure</h2>
<span class="badge" id="status">Prêt</span>
</div>
<p class="muted">Décrivez votre besoin. Après analyse, nous revenons vers vous avec une proposition adaptée et un cadrage.</p>

<label class="label">Sujet</label>
<input class="input" id="subject" placeholder="Ex : Appui stratégique sur une série de livrables"/>

<label class="label">Contexte et enjeu</label>
<textarea class="input" id="context" rows="8" placeholder="Présentez le contexte, les contraintes, les interlocuteurs et l’échéance."></textarea>

<label class="label">Attendu</label>
<textarea class="input" id="content" rows="10" placeholder="Décrivez ce qui est attendu, le périmètre et les points de vigilance."></textarea>

<div class="row gap wrap" style="margin-top:14px">
<button class="btn" id="btnSend">Qualifier mon besoin</button>
<a class="btn ghost" href="expert.html">Relecture experte</a>
</div>

<div class="fineprint" id="msg"></div>
</section>
</main>

<script src="./auth-guard.js"></script>
<script type="module">
import { apiFetch, getApiMessage } from './api.js';
import { requireLogin, wireLogout, setTicketsBadge, showToast } from './app.js';
if (!requireLogin('mission.html')) {}
wireLogout();

const el = (id) => document.getElementById(id);

async function refreshWallet(){
  try {
    const me = await apiFetch('/auth/me');
    setTicketsBadge(me.wallet);
  } catch {}
}

el('btnSend').addEventListener('click', async () => {
  try {
    const data = await apiFetch('/mission/request', {
      method:'POST',
      body:{
        subject: el('subject').value.trim(),
        context: el('context').value.trim(),
        content: el('content').value.trim()
      }
    });
    setTicketsBadge(data.wallet);
    el('msg').textContent = '✅ Votre demande a été transmise. Nous revenons vers vous après analyse et cadrage.';
    showToast('Demande transmise', 'ok');
  } catch (e) {
    console.error(e);
    el('msg').textContent = 'Erreur : ' + getApiMessage(e);
    showToast('Envoi impossible', 'err');
  }
});
refreshWallet();
</script>
</body>
</html>
