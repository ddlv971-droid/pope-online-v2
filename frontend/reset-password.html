<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Nouveau mot de passe</title>

</head>
<body class="bg po-v5-harmony">
<header class="topbar"><div class="container row between"><a class="brand link" href="index.html"><img class="brand-logo-auth" src="./assets/favicon.png" alt="POPE Online"/><div><div class="brand-title">POPE Online</div><div class="brand-sub">Nouveau mot de passe</div></div></a><div class="row gap wrap"><a class="btn ghost" href="login.html">Connexion</a></div></div></header>
<main class="auth-wrap"><section class="auth-card" style="max-width:760px;margin:0 auto">
<h2>Définir un nouveau mot de passe</h2>
<p class="muted">Choisissez un nouveau mot de passe sécurisé pour votre compte POPE Online.</p>
<label class="label">Nouveau mot de passe</label>
<div class="password-wrap"><input class="input" id="password" placeholder="••••••••" type="password" autocomplete="new-password"/><button class="password-toggle visible" id="togglePassword" type="button" aria-label="Afficher le mot de passe">👁</button></div>
<label class="label">Confirmer le mot de passe</label>
<div class="password-wrap"><input class="input" id="passwordConfirm" placeholder="••••••••" type="password" autocomplete="new-password"/><button class="password-toggle visible" id="togglePasswordConfirm" type="button" aria-label="Afficher le mot de passe">👁</button></div>
<div class="fineprint">Minimum 8 caractères. Pour un mot de passe robuste, combine lettres, chiffres et caractères spéciaux.</div>
<div class="row gap wrap" style="margin-top:14px"><button class="btn" id="btn">Mettre à jour le mot de passe</button></div>
<div class="fineprint" id="msg"></div></section></main>
</body></html>
