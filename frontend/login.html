<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Connexion</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/>
<link rel="stylesheet" href="popy.css"/>
</head>
<body class="bg po-v5-harmony">
<header class="topbar">
  <div class="container row between">
    <a class="brand link" href="public.html">
      <img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/>
      <div>
        <div class="brand-title">POPE Online</div>
        <div class="brand-sub">Connexion espace public</div>
      </div>
    </a>
    <div class="row gap wrap">      
      <a class="btn ghost" href="signup.html">Créer un compte</a>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <section class="auth-card" style="max-width:640px;margin:0 auto">
    <h2>Connexion</h2>
    <p class="muted">La connexion est réservée à l’espace public. Pour l’espace privé, la création de compte est requise avant le parcours.</p>

    <label class="label">Email</label>
    <input class="input" id="email" placeholder="xxxx@..."/>

    <label class="label">Mot de passe</label>
    <div class="password-wrap">
      <input class="input" id="password" placeholder="••••••••" type="password"/>
      <button class="password-toggle" id="togglePassword" type="button" aria-label="Afficher le mot de passe"></button>
    </div>

    <div class="row gap wrap" style="margin-top:14px">
      <button class="btn" id="btn">Se connecter</button>
      <a class="btn ghost" href="public.html">Retour à l’espace public</a>
    </div>
    <div class="fineprint" id="msg"></div>
  </section>
</main>

<script type="module">
import { apiFetch, setToken } from './api.js';
import { showToast, getFingerprint } from './app.js';

const el = (id) => document.getElementById(id);
function getNext(user) {
  const u = new URL(window.location.href);
  const explicitNext = u.searchParams.get('next');
  if (explicitNext) return explicitNext;
  if (user?.accountSpace === 'private') return 'parcours.html';
  return localStorage.getItem('pope_post_signup_next') || 'dashboard.html';
}

el('togglePassword').addEventListener('click', () => {
  const input = el('password');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  el('togglePassword').setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
});

el('btn').addEventListener('click', async () => {
  const email = el('email').value.trim();
  const password = el('password').value;
  try {
    const fp = await getFingerprint();
    const data = await apiFetch('/auth/login', { method:'POST', auth:false, body:{ email, password, fp }});
    setToken(data.token);
    showToast('Connecté ✓', 'ok');
    if (!data.user.isEmailVerified) {
      el('msg').textContent = '⚠️ Email non vérifié : vérifiez votre boîte mail pour activer votre offre gratuite.';
      return;
    }
    setTimeout(() => window.location.href = getNext(data.user), 350);
  } catch (e) {
    console.error(e);
    showToast('Connexion impossible', 'err');
    el('msg').textContent = 'Erreur: ' + (e?.data?.error || e.message);
  }
});
</script>
<script src="popy.js"></script>
</body>
</html>
