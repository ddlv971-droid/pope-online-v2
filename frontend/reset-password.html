<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Nouveau mot de passe</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/>
<style id="v56-global-clean">.v40-topbar-nav a[href*="app.html"],.v40-topbar-nav a[href*="app-private.html"],#v40MobileMenu a[href*="app.html"],#v40MobileMenu a[href*="app-private.html"],.v40-topbar-nav a[href*="expert"],#v40MobileMenu a[href*="expert"]{display:none!important}</style>
</head>
<body class="bg po-v5-harmony">
<header class="topbar"><div class="container row between"><a class="brand link" href="index.html"><img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/><div><div class="brand-title">POPE Online</div><div class="brand-sub">Nouveau mot de passe</div></div></a><div class="row gap wrap"><a class="btn ghost" href="login.html">Connexion</a></div></div></header>
<main class="auth-wrap"><section class="auth-card" style="max-width:760px;margin:0 auto">
<h2>Définir un nouveau mot de passe</h2>
<p class="muted">Choisissez un nouveau mot de passe sécurisé pour votre compte POPE Online.</p>
<label class="label">Nouveau mot de passe</label>
<div class="password-wrap"><input class="input" id="password" placeholder="••••••••" type="password" autocomplete="new-password"/><button class="password-toggle visible v40-pw-eye" id="togglePassword" type="button" aria-label="Afficher le mot de passe">👁</button></div>
<label class="label">Confirmer le mot de passe</label>
<div class="password-wrap"><input class="input" id="passwordConfirm" placeholder="••••••••" type="password" autocomplete="new-password"/><button class="password-toggle visible v40-pw-eye" id="togglePasswordConfirm" type="button" aria-label="Afficher le mot de passe">👁</button></div>
<div class="fineprint">Minimum 8 caractères. Pour un mot de passe robuste, combine lettres, chiffres et caractères spéciaux.</div>
<div class="row gap wrap" style="margin-top:14px"><button class="btn" id="btn">Mettre à jour le mot de passe</button></div>
<div class="fineprint" id="msg"></div></section></main>
<script type="module">
import { apiFetch, getApiMessage } from './api.js';
import { showToast } from './app.js';
const el = (id) => document.getElementById(id);
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
function wireToggle(buttonId, inputId){
  el(buttonId).addEventListener('click', () => {
    const i = el(inputId); const visible = i.type === 'text'; i.type = visible ? 'password' : 'text'; el(buttonId).textContent = visible ? '👁' : '🙈';
  });
}
wireToggle('togglePassword', 'password');
wireToggle('togglePasswordConfirm', 'passwordConfirm');
if (!token) {
  el('msg').textContent = 'Lien invalide ou incomplet. Merci de recommencer la procédure depuis la page de connexion.';
}
el('btn').addEventListener('click', async () => {
  const password = el('password').value;
  const confirm = el('passwordConfirm').value;
  if (!token) {
    showToast('Lien invalide','err');
    return;
  }
  if (password.length < 8) {
    el('msg').textContent = 'Votre mot de passe doit contenir au moins 8 caractères.';
    showToast('Mot de passe trop court','warn');
    return;
  }
  if (password !== confirm) {
    el('msg').textContent = 'Les deux mots de passe ne correspondent pas.';
    showToast('Confirmation différente','warn');
    return;
  }
  try {
    await apiFetch('/auth/reset-password', { method:'POST', auth:false, body:{ token, password } });
    el('msg').textContent = 'Votre mot de passe a bien été mis à jour. Vous pouvez maintenant vous connecter.';
    showToast('Mot de passe mis à jour','ok');
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  } catch (e) {
    el('msg').textContent = 'Erreur : ' + getApiMessage(e);
    showToast('Réinitialisation impossible','err');
  }
});
window.addEventListener('load', () => {
  document.querySelectorAll('input').forEach(i => { if(i.type !== 'hidden') i.value = ''; });
});
</script>
</body></html>
