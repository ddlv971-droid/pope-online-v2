<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Mission / Accompagnement</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/></head>
<body class="bg">
<header class="topbar">
<div class="container row between">
<a class="brand link" href="dashboard.html">
<div class="logo"></div>
<div>
<div class="brand-title">POPE Online</div>
<div class="brand-sub">Mission / Accompagnement • V2</div>
</div>
</a>
<div class="row gap">
<span class="badge" data-tickets="">AI: - • Expert: -</span>
<a class="btn ghost" href="app.html">POPE AI</a>
<a class="btn ghost" href="pricing.html">Offres</a>
<button class="btn" data-logout="">Déconnexion</button>
</div>
</div>
</header>
<main class="container app" style="grid-template-columns:1fr">
<section class="card left" style="max-width:980px;margin:0 auto">
<div class="row between">
<h2>Demande de mission</h2>
<span class="badge" id="status">Prêt</span>
</div>
<p class="muted">Décrivez votre besoin. La demande est envoyée automatiquement à <b>contact@pope-online.com</b>, et un message de confirmation s’affiche.</p>
<label class="label">Votre email</label>
<input class="input" id="email" placeholder="prenom.nom@..."/>
<label class="label">Sujet</label>
<input class="input" id="subject" placeholder="Ex : Cadrage + PMO BP 2026 / Organisation / Financements UE"/>
<label class="label">Description (périmètre, objectifs, délais, contraintes)</label>
<textarea class="input" id="description" placeholder="Ex : contexte, livrables attendus, calendrier, parties prenantes, budget…" rows="7"></textarea>
<div class="row gap wrap" style="margin-top:14px">
<button class="btn" id="btnSend">Envoyer la demande</button>
<a class="btn ghost" href="expert.html">Demande Expert</a>
</div>
<div class="fineprint" id="msg"></div>
</section>
</main>
<script src="./auth-guard.js"></script>
<script type="module">
    import { apiFetch } from './api.js';
    import { requireLogin, wireLogout, setTicketsBadge, showToast } from './app.js';

    if (!requireLogin('mission.html')) {}
    wireLogout();

    const el = (id) => document.getElementById(id);
    const status = (txt) => el('status').textContent = txt;

    async function refreshWallet(){
      try {
        const me = await apiFetch('/auth/me');
        setTicketsBadge(me.wallet);
      } catch {}
    }

    el('btnSend').addEventListener('click', async () => {
      const email = el('email').value.trim();
      const subject = el('subject').value.trim();
      const description = el('description').value.trim();

      status('Envoi…');
      try {
        const data = await apiFetch('/mission/request', { method:'POST', body: { email, subject, description } });
        status('Envoyé');
        showToast('Message envoyé ✅', 'ok');
        el('msg').textContent = `✅ Demande envoyée (ID: ${data.requestId}).`;
        await refreshWallet();
      } catch(e) {
        console.error(e);
        status('Erreur');
        if (e.status === 400 && e.data?.error === 'sensitive_data') {
          showToast('Données sensibles détectées', 'warn');
          el('msg').textContent = '⚠️ Données sensibles détectées. Merci d\'anonymiser.';
          return;
        }
        showToast('Envoi impossible', 'err');
        el('msg').textContent = 'Erreur: ' + (e.data?.detail || e.data?.error || e.message);
      }
      setTimeout(() => status('Prêt'), 1200);
    });

    refreshWallet();
  </script>
</body>
</html>
