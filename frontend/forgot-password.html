<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>POPE Online — Mot de passe oublié</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/>
<style id="v56-global-clean">.v40-topbar-nav a[href*="app.html"],.v40-topbar-nav a[href*="app-private.html"],#v40MobileMenu a[href*="app.html"],#v40MobileMenu a[href*="app-private.html"],.v40-topbar-nav a[href*="expert"],#v40MobileMenu a[href*="expert"]{display:none!important}</style>
</head>
<body class="bg po-v5-harmony">
<header class="topbar"><div class="container row between"><a class="brand link" href="index.html"><img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/><div><div class="brand-title">POPE Online</div><div class="brand-sub">Réinitialisation sécurisée</div></div></a><div class="row gap wrap"><a class="btn ghost" href="login.html">Retour à la connexion</a></div></div></header>
<main class="auth-wrap"><section class="auth-card" style="max-width:700px;margin:0 auto">
<h2>Mot de passe oublié</h2>
<p class="muted">Saisissez l’adresse e-mail de votre compte. Si elle existe, nous vous enverrons un lien de réinitialisation valable pendant 1 heure.</p>
<label class="label">Adresse e-mail</label><input class="input" id="email" placeholder="xxxx@..." autocomplete="off" type="email"/>
<div id="turnstileBox" style="margin-top:14px" hidden></div><div class="row gap wrap" style="margin-top:14px"><button class="btn" id="btn">Recevoir le lien</button></div>
<div class="fineprint" id="msg"></div></section></main>
<script type="module">
import { apiFetch, getApiMessage } from './api.js';
import { showToast } from './app.js';
import { mountTurnstile, getTurnstileToken, resetTurnstile } from './turnstile.js';
const el = (id) => document.getElementById(id);
mountTurnstile('turnstileBox').catch(() => {});
el('btn').addEventListener('click', async () => {
  try {
    await apiFetch('/auth/forgot-password', { method:'POST', body:{ email: el('email').value.trim(), turnstileToken:getTurnstileToken() } });
    el('msg').textContent = 'Si un compte correspond à cette adresse, un e-mail de réinitialisation vient d’être envoyé.';
    showToast('Lien envoyé si le compte existe','ok');
  } catch (e) {
    resetTurnstile();
    el('msg').textContent = 'Erreur : ' + getApiMessage(e);
    showToast('Envoi impossible','err');
  }
});
window.addEventListener('load', () => {
  document.querySelectorAll('input').forEach(i => { if(i.type !== 'hidden') i.value = ''; });
});
</script>
</body></html>
