<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>POPE Online — Espace client privé</title>
  <link href="app.css" rel="stylesheet"/>
  <link href="./assets/favicon.png" rel="icon" type="image/png"/>
</head>
<body class="bg po-v5-harmony">
  <header class="topbar">
    <div class="container row between">
      <a class="brand link" href="private.html">
        <img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/>
        <div>
          <div class="brand-title">POPE Online</div>
          <div class="brand-sub">Espace client privé</div>
        </div>
      </a>
      <div class="row gap wrap">
        <span class="badge" data-tickets>Accès sécurisé</span>
        <a class="btn ghost" href="profile.html">Mon compte</a>
        <button class="btn" data-logout>Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="container app" style="grid-template-columns:1fr">
    <section class="card left" style="max-width:1040px;margin:0 auto">
      <div class="row between wrap" style="align-items:flex-start;gap:12px">
        <div>
          <h2>Soumettre un besoin</h2>
          <p class="muted" style="margin:8px 0 0">Votre espace reste accessible même après l’échéance de l’offre gratuite afin de nous transmettre vos doléances.</p>
        </div>
        <a class="btn ghost" href="parcours.html">Parcours privé</a>
      </div>

      <div class="grid2" style="margin-top:18px">
        <div class="panel">
          <label class="label" for="companyName">Nom de la société</label>
          <input class="input" id="companyName"/>

          <label class="label" for="requesterName">Nom prénom du demandeur</label>
          <input class="input" id="requesterName"/>

          <label class="label" for="requesterEmail">Email</label>
          <input class="input" id="requesterEmail"/>

          <label class="label" for="requesterPhone">Téléphone</label>
          <input class="input" id="requesterPhone"/>
        </div>

        <div class="panel">
          <label class="label" for="needText">Besoin</label>
          <textarea id="needText" rows="11" class="input" placeholder="Décrivez votre besoin..."></textarea>
          <div class="row gap wrap" style="margin-top:14px">
            <button class="btn" id="sendNeed" type="button">Envoyer à POPE Online</button>
          </div>
          <div class="fineprint" id="needMsg"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="./auth-guard.js"></script>
  <script type="module">
    import { apiFetch } from './api.js';
    import { requireLogin, wireLogout, setTicketsBadge, showToast } from './app.js';

    requireLogin('dashboard-private.html');
    wireLogout();

    const el = (id) => document.getElementById(id);

    async function init() {
      try {
        const me = await apiFetch('/auth/me');
        setTicketsBadge(me.wallet || {});
        el('companyName').value = me?.user?.organization || '';
        el('requesterName').value = me?.user?.full_name || me?.user?.fullName || '';
        el('requesterEmail').value = me?.user?.email || '';
        el('requesterPhone').value = me?.user?.phone_full || me?.user?.phoneFull || '';

        if (me?.wallet?.trial_expires_at && new Date(me.wallet.trial_expires_at).getTime() < Date.now()) {
          el('needMsg').textContent = 'Votre offre gratuite est arrivée à échéance. Votre espace reste accessible. Vous pouvez continuer à nous transmettre vos besoins.';
        }
      } catch (error) {
        console.error(error);
        el('needMsg').textContent = 'Impossible de charger automatiquement vos informations. Vous pouvez toutefois compléter le formulaire.';
      }
    }

    init();

    el('sendNeed').addEventListener('click', async () => {
      try {
        await apiFetch('/client/message', {
          method: 'POST',
          body: {
            companyName: el('companyName').value.trim(),
            requesterName: el('requesterName').value.trim(),
            requesterEmail: el('requesterEmail').value.trim(),
            requesterPhone: el('requesterPhone').value.trim(),
            needText: el('needText').value.trim()
          }
        });
        el('needMsg').textContent = 'Message transmis. Un conseiller POPE Online vous contactera rapidement.';
        showToast('Demande envoyée', 'ok');
      } catch (error) {
        console.error(error);
        el('needMsg').textContent = 'Erreur: ' + (error?.data?.error || error.message);
        showToast('Envoi impossible', 'err');
      }
    });
  </script>
</body>
</html>
