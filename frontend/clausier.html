<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POPE Online — Clausier documentaire</title>
<link href="app.css" rel="stylesheet"/>
<link href="./assets/favicon.png" rel="icon" type="image/png"/>
<style>
:root{--blue:#0079c1;--cyan:#03a0d7;--dark:#0b2440;--muted:#50627a;--line:#dce9f4}
.clausier-wrap{max-width:1100px;margin:0 auto;padding:32px 20px}
.clausier-hero{text-align:center;padding:40px 0 32px}
.clausier-hero h1{font-size:clamp(24px,4vw,38px);font-weight:800;color:var(--dark);letter-spacing:-.02em;margin-bottom:12px}
.clausier-hero p{font-size:16px;color:var(--muted);max-width:560px;margin:0 auto}
.clausier-search{max-width:600px;margin:24px auto;display:flex;gap:12px}
.clausier-search input{flex:1;padding:13px 18px;border:1.5px solid var(--line);border-radius:14px;font-size:14px;outline:none;color:var(--dark)}
.clausier-search input:focus{border-color:var(--blue)}
.clausier-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;justify-content:center}
.cat-btn{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.cat-btn:hover,.cat-btn.active{border-color:var(--blue);color:var(--blue);background:#eef7ff}
.clausier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.doc-card{background:#fff;border-radius:18px;border:1.5px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;transition:.2s;cursor:pointer}
.doc-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.doc-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue)}
.doc-title{font-size:15px;font-weight:700;color:var(--dark);line-height:1.35}
.doc-desc{font-size:13px;color:var(--muted);line-height:1.5}
.doc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.doc-type{font-size:11px;font-weight:600;color:var(--muted);background:#f0f7fc;border-radius:6px;padding:3px 8px}
.doc-action{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none}
.doc-action:hover{text-decoration:underline}
.clausier-locked{background:linear-gradient(135deg,#fafafa,#f0f7fc);border:2px dashed var(--line);text-align:center;padding:40px;border-radius:18px;grid-column:1/-1}
.clausier-locked h3{font-size:18px;font-weight:800;color:var(--dark);margin-bottom:8px}
.clausier-locked p{font-size:14px;color:var(--muted);margin-bottom:16px}
@media(max-width:768px){.clausier-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.clausier-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-logout-target="index.html" class="bg po-v5-harmony">
<header class="topbar">
  <div class="container row between">
    <a class="brand link" href="dashboard.html">
      <img class="brand-logo-auth" src="./assets/popeonline-logo.png" alt="POPE Online"/>
      <div><div class="brand-title">POPE Online</div><div class="brand-sub">Clausier documentaire</div></div>
    </a>
    <div class="row gap">
      <a class="btn ghost" href="dashboard.html">Mon espace</a>
      <button class="btn ghost" onclick="localStorage.removeItem('pope_session_active');sessionStorage.removeItem('pope_session_token');window.location.href='login.html'">Déconnexion</button>
    </div>
  </div>
</header>

<div class="clausier-wrap">
  <div class="clausier-hero">
    <span class="badge">📚 Bibliothèque premium</span>
    <h1>Clausier documentaire</h1>
    <p>Modèles prêts à l'emploi, documents types et ressources validées par les experts POPE Online.</p>
  </div>

  <div class="clausier-search">
    <input type="text" id="searchInput" placeholder="Rechercher un modèle, un type de document…" oninput="filterDocs()"/>
  </div>

  <div class="clausier-cats" id="catsBar">
    <button class="cat-btn active" data-cat="all" onclick="setCategory('all',this)">Tous</button>
    <button class="cat-btn" data-cat="marches" onclick="setCategory('marches',this)">Marchés publics</button>
    <button class="cat-btn" data-cat="courriers" onclick="setCategory('courriers',this)">Courriers</button>
    <button class="cat-btn" data-cat="deliberations" onclick="setCategory('deliberations',this)">Délibérations</button>
    <button class="cat-btn" data-cat="formalites" onclick="setCategory('formalites',this)">Formalités</button>
    <button class="cat-btn" data-cat="rh" onclick="setCategory('rh',this)">RH & Social</button>
  </div>

  <div class="clausier-grid" id="docGrid">
    <!-- Rempli par JS -->
  </div>
</div>

<script>
// Bibliothèque documentaire — à alimenter via le dashboard admin
const DOCS = [
  // Marchés publics — Sources officielles
  {cat:"marches",title:"DC1 — Lettre de candidature",desc:"Formulaire officiel de lettre de candidature et habilitation du mandataire pour marchés publics.",type:"PDF officiel",url:"https://www.economie.gouv.fr/daj/les-formulaires-de-declaration-du-candidat"},
  {cat:"marches",title:"DC2 — Déclaration du candidat",desc:"Déclaration du candidat individuel ou du membre du groupement.",type:"PDF officiel",url:"https://www.economie.gouv.fr/daj/les-formulaires-de-declaration-du-candidat"},
  {cat:"marches",title:"DC4 — Déclaration de sous-traitance",desc:"Formulaire officiel de déclaration de sous-traitance pour marchés publics.",type:"PDF officiel",url:"https://www.economie.gouv.fr/daj/les-formulaires-de-declaration-du-candidat"},
  {cat:"marches",title:"CCAP, RC, CCTP — Modèles officiels",desc:"Cahiers des Clauses Administratives et modèles de documents contractuels (CCAG, CCAP, CCTP, RC).",type:"Word/PDF",url:"https://www.economie.gouv.fr/daj/cahiers-clauses-administratives-generales-et-techniques"},
  {cat:"marches",title:"Formulaires ATTRI, OUV, NOTI",desc:"Formulaires officiels de notification, attribution et ouverture des plis pour marchés publics.",type:"PDF officiel",url:"https://www.marche-public.fr/contrats-publics/Fiche-DAJ-MAPA.htm"},
  {cat:"marches",title:"Guide pratique MAPA 2024",desc:"Guide officiel de la procédure adaptée : seuils, publicité, mise en concurrence. Source France Marchés.",type:"PDF",url:"https://www.francemarches.com/fiches/procedure-adaptee-mapa"},
  {cat:"marches",title:"Rapport analyse des offres — OUV8",desc:"Trame officielle OUV8 pour la rédaction du rapport d'analyse des candidatures et offres.",type:"Word/PDF",url:"https://www.economie.gouv.fr/daj/les-formulaires-douverture-des-plis"},
  // Courriers
  {cat:"courriers",title:"Bibliothèque lettres types",desc:"Modèles officiels de courriers administratifs pour toutes situations : démarches, réclamations, demandes.",type:"Word/PDF",url:"https://www.lettres-types-gratuites.com/guide-lettres-administratives/"},
  {cat:"courriers",title:"Lettre de mise en demeure",desc:"Modèle officiel de mise en demeure avec structure légale, délai de réponse et mentions obligatoires.",type:"Word",url:"https://www.recouvrer.fr/la-mise-en-demeure/lettre-de-mise-en-demeure/"},
  {cat:"courriers",title:"Mise en demeure nuisances voisinage",desc:"Simulateur officiel service-public.fr pour la mise en demeure de cesser des nuisances de voisinage.",type:"En ligne",url:"https://www.service-public.gouv.fr/simulateur/calcul/MiseEnDemeureDeCesserLesNuisancesDeVoisinage"},
  // Délibérations
  {cat:"deliberations",title:"Modèles de délibérations — AMF",desc:"Bibliothèque officielle AMF de modèles de délibérations municipales, mise à jour régulièrement.",type:"Word",url:"https://www.amf.asso.fr/m/document/document.php?id=11527"},
  // Formalités
  {cat:"formalites",title:"Guichet unique — Formalités entreprises",desc:"Portail officiel de dépôt des formalités : création, modification, cessation d'activité.",type:"En ligne",url:"https://formalites.entreprises.gouv.fr/"},
  {cat:"formalites",title:"Modèles statuts — Bpifrance Création",desc:"Statuts types pour SAS, SASU, SARL, EURL. Notice d'utilisation incluse.",type:"Word",url:"https://bpifrance-creation.fr/encyclopedie/structures-juridiques"},
  {cat:"formalites",title:"Cerfa 13844 — Cessation d'activité",desc:"Formulaire officiel de déclaration de cessation pour entreprise individuelle.",type:"PDF officiel",url:"https://entreprendre.service-public.gouv.fr/vosdroits/F37363"},
  {cat:"formalites",title:"Cerfa 14598 — Rupture conventionnelle",desc:"Formulaire officiel d'homologation de rupture conventionnelle (art. L1237-14 CT).",type:"PDF officiel",url:"https://www.formulaires.service-public.fr/gf/cerfa_14598.do"},
  {cat:"formalites",title:"Contrat CDI — Ministère du Travail",desc:"Trame officielle de CDI conforme au code du travail.",type:"Word",url:"https://www.service-public.fr/particuliers/vosdroits/F1906"},
  {cat:"formalites",title:"Conventions collectives — Légifrance",desc:"Accès direct à toutes les conventions collectives nationales en vigueur.",type:"En ligne",url:"https://www.service-public.gouv.fr/particuliers/vosdroits/F78"},
];

let currentCat = 'all';
let searchTerm = '';

function renderDocs() {
  const grid = document.getElementById('docGrid');
  const filtered = DOCS.filter(d => {
    const matchCat  = currentCat === 'all' || d.cat === currentCat;
    const matchSearch = !searchTerm || d.title.toLowerCase().includes(searchTerm) || d.desc.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="clausier-locked"><h3>Aucun document trouvé</h3><p>Essayez un autre terme ou une autre catégorie.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="doc-card">
      <div class="doc-cat">${catLabel(d.cat)}</div>
      <div class="doc-title">${d.title}</div>
      <div class="doc-desc">${d.desc}</div>
      <div class="doc-footer">
        <span class="doc-type">${d.type}</span>
        ${d.url !== '#' ? '<span style="background:#d1fae5;color:#065f46;font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:4px">✓ Officiel</span>' : ''}
        <a href="${d.url}" class="doc-action" target="_blank" rel="noopener noreferrer"
           onclick="${d.url === '#' ? 'return false' : ''}"
           style="${d.url === '#' ? 'opacity:.4;cursor:not-allowed' : ''}">
          ${d.url === '#' ? '⏳ Bientôt disponible' : '↗ Accéder à la source'}
        </a>
      </div>
    </div>
  `).join('');
}

function catLabel(cat) {
  return {marches:'Marchés publics',courriers:'Courriers',deliberations:'Délibérations',formalites:'Formalités',rh:'RH & Social'}[cat] || cat;
}

function setCategory(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDocs();
}

function filterDocs() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  renderDocs();
}

document.addEventListener("DOMContentLoaded", function() {
  // Mettre à jour le compteur
  var countEl = document.getElementById('docCount');
  if (countEl) countEl.textContent = DOCS.length;

  // Vérifier le plan depuis localStorage (positionné à la connexion)
  try {
    var userRaw = localStorage.getItem('pope_session_user');
    if (userRaw) {
      var user = JSON.parse(userRaw);
      var wallet = user.wallet || {};
      var planLabel = wallet.plan_label || 'Free';
      var trialExpired = wallet.trial_expired || false;
      var status = wallet.status || '';
      // Bloquer uniquement si plan Free ET essai expiré
      if (planLabel === 'Free' && (trialExpired || status === 'trial_expired')) {
        document.getElementById('docGrid').innerHTML =
          '<div class="clausier-locked">' +
          '<div style="font-size:40px;margin-bottom:12px">🔒</div>' +
          '<h3>Clausier disponible dès le plan Starter</h3>' +
          '<p>Votre période d\'essai est terminée. Souscrivez un plan pour accéder à la bibliothèque documentaire.</p>' +
          '<a href="pricing.html" style="display:inline-flex;margin-top:8px;background:linear-gradient(135deg,#0079c1,#03a0d7);color:#fff;border-radius:12px;padding:11px 24px;font-weight:700;text-decoration:none">Voir les plans</a>' +
          '</div>';
        return;
      }
    }
  } catch(e) {}
  renderDocs();
});
</script>
</body>
</html>
